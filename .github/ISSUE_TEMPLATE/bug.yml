name: 🐛 오류 수정
description: 정산 서버가 기대와 다르게 동작하는 문제
title: "[정산] "
labels: ["bug"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 증상
      description: 실제로 무슨 일이 일어났는지 적습니다.
      placeholder: 같은 targetDate로 배치를 두 번 돌리면 정산 금액이 두 배가 된다.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 남이 그대로 따라 할 수 있게 순서대로 적습니다.
      placeholder: |
        1. 2026-08-10 결제 데이터를 넣는다
        2. targetDate=2026-08-10 으로 배치를 실행한다
        3. 같은 파라미터로 한 번 더 실행한다
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 원래 어떻게 동작해야 하는지 적습니다.
      placeholder: 이미 CONFIRMED 상태이므로 두 번째 실행은 시작 전 예외로 거부되어야 한다.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그·스택트레이스
      description: 있으면 붙입니다. 연결 문자열·비밀번호가 섞이지 않았는지 확인하고 올려주세요.
      render: text
    validations:
      required: false

  - type: input
    id: affected
    attributes:
      label: 영향받는 담당자
      description: 다른 서버가 원인이거나 영향을 받으면 멘션합니다.
      placeholder: "@김주엽"
    validations:
      required: false
