spring.application.name=driver-settlement-system

# --- 가상 스레드 ---
# 서버 간 동기 호출이 많아 I/O 대기가 길다. 3개 서비스에 동일하게 적용한다.
spring.threads.virtual.enabled=true

# --- 정산 DB (값은 환경변수로 주입한다. 여기에 직접 적지 않는다) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# --- 로그인 DB (읽기 전용 계정 settlement_ro. 값은 환경변수로 주입한다) ---
# 기사 이름·계좌번호만 읽는다. 남의 업무 DB가 아니라 네 곳이 함께 보는 공유 참조 DB다.
auth.datasource.url=${AUTH_DATASOURCE_URL}
auth.datasource.username=${AUTH_DATASOURCE_USERNAME}
auth.datasource.password=${AUTH_DATASOURCE_PASSWORD}

# 세 서버 + 대시보드가 한 인스턴스에 붙어 경합이 생긴다. 기본값(10)이면 서버 3대만으로
# 30 커넥션이다. 기사 정보 조회는 빈도가 낮아 3으로 묶는다.
auth.datasource.hikari.maximum-pool-size=3

# --- JPA ---
# validate: 엔티티와 실제 테이블이 다르면 부팅을 실패시킨다.
# 스키마는 Flyway가 만든다(#12). update/create를 쓰면 둘이 싸운다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
# 스키마는 db/migration의 SQL이 만든다. 적용된 파일은 절대 수정하지 않는다 —
# 체크섬이 달라져 다음 실행이 실패한다. 고칠 것이 생기면 V2를 새로 만든다.
spring.flyway.enabled=true

# --- Spring Batch ---
# false: 앱이 뜰 때 Job을 자동 실행하지 않는다. @Scheduled와 수동 실행으로만 돌린다.
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# 매일 새벽 3시(Asia/Seoul)에 전일 정산. 개발 중에는 환경변수로 짧게 바꿔 돌려본다.
# 하드코딩하지 않는 이유: 시각을 바꾸려고 코드를 고칠 이유가 없다.
settlement.batch.cron=${SETTLEMENT_BATCH_CRON:0 0 3 * * *}

# --- 정산 규칙 ---
# 수수료율은 하드코딩하지 않는다. 값이 바뀌어도 과거 정산을 설명할 수 있어야 하므로
# SETTLEMENTS에는 계산 결과가 아니라 fee_amount를 값으로 저장한다.
settlement.fee-rate=0.20

# --- 외부 서버 주소 (하드코딩 금지, 환경변수 주입) ---
settlement.client.payment.base-url=${PAYMENT_API_BASE_URL}
settlement.client.ledger.base-url=${LEDGER_API_BASE_URL}
