spring.application.name=driver-settlement-system

# --- 가상 스레드 ---
# 서버 간 동기 호출이 많아 I/O 대기가 길다. 3개 서비스에 동일하게 적용한다.
spring.threads.virtual.enabled=true

# --- 정산 DB (값은 환경변수로 주입한다. 여기에 직접 적지 않는다) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# --- JPA ---
# validate: 엔티티와 실제 테이블이 다르면 부팅을 실패시킨다.
# 스키마는 Flyway가 만든다(#12). update/create를 쓰면 둘이 싸운다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
# flyway-core 의존성은 #12에서 붙는다. 그때까지 이 설정은 아무 일도 하지 않는다.
spring.flyway.enabled=true

# --- Spring Batch ---
# false: 앱이 뜰 때 Job을 자동 실행하지 않는다. @Scheduled와 수동 실행으로만 돌린다.
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# --- 정산 규칙 ---
# 수수료율은 하드코딩하지 않는다. 값이 바뀌어도 과거 정산을 설명할 수 있어야 하므로
# SETTLEMENTS에는 계산 결과가 아니라 fee_amount를 값으로 저장한다.
settlement.fee-rate=0.20

# --- 외부 서버 주소 (하드코딩 금지, 환경변수 주입) ---
settlement.client.payment.base-url=${PAYMENT_API_BASE_URL}
settlement.client.ledger.base-url=${LEDGER_API_BASE_URL}
